name: Build Package

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        # Auto-synced from packages/*/ by sync-package-options.yml
        options: [all, wallust]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set.outputs.packages }}
    steps:
      - uses: actions/checkout@v5

      - id: set
        run: |
          set -euo pipefail
          input="${{ inputs.package }}"
          if [[ "$input" == "all" ]]; then
            mapfile -t pkgs < <(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
            ((${#pkgs[@]})) || { echo "::error::No packages found under packages/"; exit 1; }
            json="$(printf '%s\n' "${pkgs[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          else
            [[ -f "packages/${input}/build.yaml" ]] || { echo "::error::Unknown package: ${input}"; exit 1; }
            json="$(jq -n -c --arg p "$input" '[$p]')"
          fi
          {
            echo "packages<<EOF"
            echo "$json"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    container:
      image: archlinux:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Restore pacman package cache
        id: cache-pacman
        uses: actions/cache/restore@v5
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg

      - name: Bootstrap git for checkout
        run: pacman -Syy --noconfirm git

      - uses: actions/checkout@v5

      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            /root/cargo-target/${{ matrix.package }}
          key: cargo-${{ matrix.package }}

      - name: Install tools
        run: |
          pacman -Syyu --noconfirm base-devel jq curl github-cli
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64 -o /usr/bin/yq
          chmod +x /usr/bin/yq
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - id: build
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          cfg="${GITHUB_WORKSPACE}/packages/${package}/build.yaml"

          ref="$(yq -r '.source.ref // ""' "$cfg")"
          if [[ -z "$ref" || "$ref" == latest ]]; then
            ref="$(curl -fsSL "$(yq -r '.source.releases' "$cfg")" | jq -r '
              [.[] | select((.draft // false) | not)][0].tag_name
            ')"
          fi
          [[ -n "$ref" && "$ref" != null ]]

          name="$(yq -r '.name' "$cfg")"
          arch="$(yq -r '.arch' "$cfg")"
          pkgbuild="$(yq -r '.pkgbuild' "$cfg")"
          repo="$(yq -r '.source.repo' "$cfg")"
          build="$(yq -r '.build' "$cfg")"
          stage="$(yq -r '.stage' "$cfg")"
          pkgver="${ref#v}"; pkgver="${pkgver//-/.}"
          tag="${name}-v${pkgver}"

          src="$(mktemp -d)" staging="$(mktemp -d)"
          trap 'rm -rf "$src" "$staging"' EXIT
          clone="$repo"
          [[ -z "${SOURCE_TOKEN:-}" ]] || clone="${repo/https:\/\//https://x-access-token:${SOURCE_TOKEN}@}"

          git clone --depth 1 -b "$ref" "$clone" "$src"
          mapfile -t deps < <(yq -r '.makedepends[]' "$cfg" | grep -v '^null$')
          ((${#deps[@]})) && pacman -Syyu --noconfirm --needed "${deps[@]}"

          export CARGO_TARGET_DIR="/root/cargo-target/${package}"
          mkdir -p "$CARGO_TARGET_DIR"
          export STAGING="$staging"
          (cd "$src" && bash -euo pipefail -c "$build")
          # Makefiles expect ./target/; CARGO_TARGET_DIR redirects cargo output elsewhere.
          ln -sfn "$CARGO_TARGET_DIR" "$src/target"
          (cd "$src" && bash -euo pipefail -c "$stage")

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          tarball="${name}-${pkgver}-${arch}.tar.gz"
          tar -C "$staging" -czf "${GITHUB_WORKSPACE}/artifacts/${tarball}" .
          sha256="$(sha256sum "${GITHUB_WORKSPACE}/artifacts/${tarball}" | awk '{print $1}')"

          {
            echo "ref=$ref"
            echo "pkgver=$pkgver"
            echo "pkgbuild=$pkgbuild"
            echo "tag=$tag"
            echo "tarball_name=$tarball"
            echo "sha256=$sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.build.outputs.tag }}" \
            "${GITHUB_WORKSPACE}/artifacts/${{ steps.build.outputs.tarball_name }}" \
            --repo "${{ github.repository }}" --clobber 2>/dev/null \
            || gh release create "${{ steps.build.outputs.tag }}" \
              "${GITHUB_WORKSPACE}/artifacts/${{ steps.build.outputs.tarball_name }}" \
              --repo "${{ github.repository }}"

      - name: Bump PKGBUILD
        if: success()
        env:
          PKGBUILDS_TOKEN: ${{ secrets.PKGBUILDS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PKGBUILDS_TOKEN}" ]]; then
            echo "::error::PKGBUILDS_TOKEN secret is not set. See SECRETS.md."
            exit 1
          fi
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/pkgbuilds"
          git clone "https://x-access-token:${PKGBUILDS_TOKEN}@github.com/swindlesmccoop/PKGBUILDs.git" \
            "${GITHUB_WORKSPACE}/pkgbuilds"
          dir="${{ steps.build.outputs.pkgbuild }}"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${{ steps.build.outputs.pkgver }}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${{ steps.build.outputs.sha256 }}')/" \
            "${GITHUB_WORKSPACE}/pkgbuilds/${dir}/PKGBUILD"
          cd "${GITHUB_WORKSPACE}/pkgbuilds"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${dir}/PKGBUILD"
          git diff --cached --quiet || git commit -m "chore(${dir}): ${{ steps.build.outputs.pkgver }} [skip ci]"
          git push

      # Save after all work so caches persist even when build/publish fails.
      # Unlike save-always, this also updates caches on cache-hit runs (new .pkg / cargo artifacts).
      - name: Save pacman package cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.cache-pacman.outputs.cache-primary-key }}

      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            /root/cargo-target/${{ matrix.package }}
          key: ${{ steps.cache-cargo.outputs.cache-primary-key }}
